# SPDX-License-Identifier: MIT
# Builds and tests the OpenPluginSDK build of Blue Channel (plugin/) on Windows x64 and keeps the
# CLAP and VST3 plug-ins and the installer as a run artifact. Nothing is signed. AAX is not built
# here (the AAX SDK is not public), and the SDK makes no LV2 or standalone on Windows.
name: windows

on:
  push:
    branches: [openplugin-port]
    tags: ["v*"]
  workflow_dispatch:

env:
  # The VST3 SDK revision the source is built and tested with on macOS.
  VST3_SDK_REF: v3.8.1_build_84

jobs:
  windows:
    name: Windows x64 build, tests and installer
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out Blue Channel
        uses: actions/checkout@v4
        with:
          path: BlueChannel
      # Cargo takes the SDK's crates at the revision in plugin/Cargo.toml; the shells are built from
      # a checkout of the same one.
      - name: Read the OpenPluginSDK revision
        id: sdk
        shell: bash
        run: |
          rev="$(sed -n 's/^openplugin = .*rev = "\([0-9a-f]*\)".*/\1/p' BlueChannel/plugin/Cargo.toml | head -n 1)"
          [ -n "$rev" ] || { echo "no OpenPluginSDK revision in plugin/Cargo.toml" >&2; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          repository: MistaMin/OpenPluginSDK
          ref: ${{ steps.sdk.outputs.rev }}
          path: OpenPluginSDK
      - name: Check out the VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: ${{ env.VST3_SDK_REF }}
          path: vst3sdk
          submodules: recursive
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # tests/null.rs compares against an installed 1.0.0 and is run on the release machine.
      - name: Tests
        working-directory: BlueChannel/plugin
        run: cargo test --release --lib --test conformance --test host_behaviour --test state --test offline

      - name: Build the plug-ins
        shell: pwsh
        working-directory: BlueChannel/plugin
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content ..\VERSION -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\OpenPluginSDK\scripts\windows\build_plugin.ps1" `
            -ManifestPath Cargo.toml -Name "Blue Channel" -Version $version `
            -Manufacturer OpenGrid -BundleId com.opengrid.bluechannel -Formats clap,vst3 -Editor -Tail `
            -Vst3Sdk "$env:GITHUB_WORKSPACE\vst3sdk" -Out "$env:GITHUB_WORKSPACE\dist" `
            -WorkDir "$env:GITHUB_WORKSPACE\build-plugins"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content BlueChannel/VERSION -Raw).Trim()
          $stage = Join-Path $env:GITHUB_WORKSPACE 'stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse dist\* $stage
          Copy-Item BlueChannel\LICENSE, BlueChannel\BINARY_LICENSE.txt, BlueChannel\THIRD_PARTY_LICENSES.md, `
            BlueChannel\CHANGELOG.md, BlueChannel\docs\USER_MANUAL.md $stage
          Copy-Item -Recurse BlueChannel\docs\images (Join-Path $stage 'images')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "/DStageDir=$stage" BlueChannel\plugin\installer\BlueChannel.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Join-Path $env:GITHUB_WORKSPACE "Blue-Channel-$version-windows-x64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          # A line feed only: shasum -c on macOS and Linux does not accept CRLF.
          [IO.File]::WriteAllText("$setup.sha256", "$hash  Blue-Channel-$version-windows-x64-setup.exe`n")
          Get-Item $setup | Format-List Name, Length
          Get-Content "$setup.sha256"

      - name: Keep the plug-ins and the installer
        uses: actions/upload-artifact@v4
        with:
          name: blue-channel-windows-x64
          path: |
            dist
            Blue-Channel-*-windows-x64-setup.exe
            Blue-Channel-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
