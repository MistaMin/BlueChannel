# SPDX-License-Identifier: MIT
# Builds the model tests (Source/, tests/) with AddressSanitizer and runs them. The plugin is built and
# tested by windows.yml and on the release machine (plugin/README.md).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  engine-sanitizer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build engine tests with AddressSanitizer
        run: |
          cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          cmake --build build/asan --target BlueChannelStageTest BlueChannelModelTest --parallel 2
      - name: Run engine tests with AddressSanitizer
        run: ctest --test-dir build/asan --output-on-failure
