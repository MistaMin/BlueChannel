[package]
name = "blue-channel"
version = "1.1.0"
description = "Blue Channel on OpenPluginSDK"
edition = "2021"
license = "MIT"
publish = false

[lib]
# cdylib: CLAP and LV2; staticlib: linked into the VST3, Audio Unit and AAX shells (the SDK's scripts/build_plugin.sh).
crate-type = ["cdylib", "staticlib", "rlib"]

# OpenPluginSDK is taken from a local checkout: .cargo/config.toml (not in Git,
# it holds machine paths) patches these in. See README.md.
[dependencies]
openplugin = "1.0.0-beta"
goodlookindri-shell = "0.2"
cpal = { version = "0.15", optional = true }

[features]
# HQ Mode: the offline component solver (ngspice, loaded at run time). See README.md.
hq = []
# The standalone app (src/bin/standalone.rs), which opens an audio device.
standalone = ["dep:cpal"]
# For host tests only: the build is "Blue Channel Port Test" with ids of its own, so it can be
# installed beside the release. Never ship a build with it.
qa-identity = []

[dev-dependencies]
openplugin-testing = "1.0.0-beta"

[[bin]]
name = "lv2_ttl"
path = "src/bin/lv2_ttl.rs"

[[bin]]
name = "blue-channel-app"
path = "src/bin/standalone.rs"
required-features = ["standalone"]

[build-dependencies]
cc = "1"

[workspace]
