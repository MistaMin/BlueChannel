[package]
name = "blue-channel"
version = "1.1.0"
description = "Blue Channel on OpenPluginSDK"
edition = "2021"
license = "MIT"
publish = false

[lib]
# cdylib: CLAP and LV2; staticlib: linked into the VST3, Audio Unit and AAX shells (the SDK's scripts/build_plugin.sh).
crate-type = ["cdylib", "staticlib", "rlib"]

# OpenPluginSDK at one pinned revision. scripts/build.sh and the Windows workflow read the revision
# from here and build the format shells from a checkout of the same one. See README.md.
[dependencies]
openplugin = { git = "https://github.com/MistaMin/OpenPluginSDK", rev = "1f608fefe1a0ebc0215ffd67591a79c82f950686" }
goodlookindri-shell = { git = "https://github.com/MistaMin/OpenPluginSDK", rev = "1f608fefe1a0ebc0215ffd67591a79c82f950686" }
cpal = { version = "0.15", optional = true }

[features]
# HQ Mode: the offline component solver (ngspice, loaded at run time). See README.md.
hq = []
# For tests only: C++ `new` goes through Rust's allocator, so the conformance kit's allocation check
# sees the model (cpp/count_new.cpp). Never ship a build with it.
count-cpp-new = []
# The standalone app (src/bin/standalone.rs), which opens an audio device.
standalone = ["dep:cpal"]
# For host tests only: the build is "Blue Channel Port Test" with ids of its own, so it can be
# installed beside the release. Never ship a build with it.
qa-identity = []

[dev-dependencies]
openplugin = { git = "https://github.com/MistaMin/OpenPluginSDK", rev = "1f608fefe1a0ebc0215ffd67591a79c82f950686", features = ["testing"] }
openplugin-testing = { git = "https://github.com/MistaMin/OpenPluginSDK", rev = "1f608fefe1a0ebc0215ffd67591a79c82f950686" }

[[bin]]
name = "lv2_ttl"
path = "src/bin/lv2_ttl.rs"

[[bin]]
name = "blue-channel-app"
path = "src/bin/standalone.rs"
required-features = ["standalone"]

[build-dependencies]
cc = "1"

[workspace]
